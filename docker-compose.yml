version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cooperative-voting-postgres
    environment:
      POSTGRES_DB: cooperative_voting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voting-network

networks:
  voting-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
