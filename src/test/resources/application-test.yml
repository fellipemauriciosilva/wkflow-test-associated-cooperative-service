spring:
  application:
    name: cooperative-voting-system

  datasource:
    url: jdbc:tc:postgresql:///cooperativevoting
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQL16Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    root: WARN
    com.example.cooperativevoting: DEBUG
    org.testcontainers: INFO
