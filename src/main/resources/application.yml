spring:
  application:
    name: pautas
  datasource:
    url: jdbc:h2:mem:pautas-${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

pautas:
  votos:
    habilitado: ${PAUTAS_VOTOS_HABILITADO:false}
