spring:
  application:
    name: votacao-pautas
  datasource:
    url: jdbc:h2:mem:votacao;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
